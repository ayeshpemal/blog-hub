apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: blog-hub-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-hub-frontend
  template:
    metadata:
      labels:
        app: blog-hub-frontend
    spec:
      containers:
      - name: frontend
        image: ayeshapemal/blog-hub-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: blog-hub-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000