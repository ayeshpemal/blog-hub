apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  labels:
        app: blog-hub-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-hub-db
  template:
    metadata:
      labels:
        app: blog-hub-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "blog_hub_db" # Kubernetes forces Postgres to create this DB on boot!
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: blog-hub-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432