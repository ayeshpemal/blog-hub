apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: blog-hub-nginx
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: blog-hub-nginx
  template:
    metadata:
      labels:
        app: blog-hub-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config  
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: LoadBalancer # This tells AWS to give you a public URL web entry gateway!
  selector:
    app: blog-hub-nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80