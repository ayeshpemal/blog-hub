name: CI/CD Pipeline to AWS EKS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-hub-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-hub-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Copy Kubernetes Manifests to EC2 Host
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "kubernetes/"
          target: "/home/ubuntu/blog-hub/"

      - name: Deploy stack on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            minikube start

            cd /home/ubuntu/blog-hub/kubernetes

            kubectl apply -f postgres-secret.yaml
            kubectl apply -f postgres-config.yaml
            kubectl apply -f postgres-deployment.yaml

            kubectl rollout status deployment/blog-hub-db --timeout=60s

            kubectl delete job blog-hub-migration-job --ignore-not-found=true
            kubectl apply -f migration-job.yaml

            kubectl apply -f nginx-config.yaml
            kubectl apply -f nginx-deployment.yaml

            kubectl apply -f backend-deployment.yaml
            kubectl apply -f frontend-deployment.yaml

            kubectl rollout restart deployment/nginx-deployment
            kubectl rollout restart deployment/backend-deployment
            kubectl rollout restart deployment/frontend-deployment

            rm -rf /tmp/kubernetes
